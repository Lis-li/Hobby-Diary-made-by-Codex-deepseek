<!-- app-icon.svg —— 爱好日记应用图标源文件（暖色渐变 + 白底小花），由无头 Chrome 栅格化为 icon-192/512.png。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE0B2"/>
      <stop offset="0.5" stop-color="#FFB199"/>
      <stop offset="1" stop-color="#EE7FA2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="166" fill="#FFFFFF" opacity="0.95"/>
  <g transform="translate(256 256)">
    <g fill="#EE7FA2">
      <ellipse cx="0" cy="-74" rx="30" ry="50" transform="rotate(0)"/>
      <ellipse cx="0" cy="-74" rx="30" ry="50" transform="rotate(72)"/>
      <ellipse cx="0" cy="-74" rx="30" ry="50" transform="rotate(144)"/>
      <ellipse cx="0" cy="-74" rx="30" ry="50" transform="rotate(216)"/>
      <ellipse cx="0" cy="-74" rx="30" ry="50" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="34" fill="#FFB84D"/>
    <circle cx="0" cy="0" r="16" fill="#FFF9F4"/>
  </g>
</svg>
