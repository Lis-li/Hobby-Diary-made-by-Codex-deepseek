<!-- index.html —— 爱好日记：每日爱好记录的本地 Web 应用主页面（零依赖、可离线使用）。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hobby Diary</title>
<meta name="description" content="记录每日爱好的本地应用：打卡、日历、统计与数据备份。">
<meta name="theme-color" content="#FF8A65">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hobby Diary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" id="favicon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css?v=2.6">
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="brand">
      <span class="brand-logo" id="brand-logo">🌸</span>
      <div class="brand-text">
        <h1>Hobby Diary<span class="version-tag" id="version-tag">v2.6</span></h1>
        <p id="header-sub"></p>
      </div>
    </div>
    <div class="header-actions">
      <button id="music-toggle" class="icon-btn" data-action="toggle-music" title="背景音乐">🎵</button>
      <button id="theme-toggle" class="icon-btn" data-action="toggle-theme" title="切换深浅色">🌙</button>
    </div>
  </header>

  <main id="view-today" class="view active"></main>
  <main id="view-calendar" class="view"></main>
  <main id="view-stats" class="view"></main>
  <main id="view-hobbies" class="view"></main>
  <main id="view-data" class="view"></main>
</div>

<nav class="tab-bar">
  <button class="tab-btn active" data-action="switch-tab" data-tab="today"><span class="tab-ico">📝</span><span>今日</span></button>
  <button class="tab-btn" data-action="switch-tab" data-tab="calendar"><span class="tab-ico">🗓</span><span>日历</span></button>
  <button class="tab-btn" data-action="switch-tab" data-tab="stats"><span class="tab-ico">📊</span><span>统计</span></button>
  <button class="tab-btn" data-action="switch-tab" data-tab="hobbies"><span class="tab-ico">🎨</span><span>项目</span></button>
  <button class="tab-btn" data-action="switch-tab" data-tab="data"><span class="tab-ico">⚙️</span><span>设置</span></button>
</nav>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="icon-btn" data-action="close-modal" title="关闭">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="chart-tooltip" class="chart-tooltip hidden"></div>

<div id="lock-screen" class="lock-screen hidden">
  <div class="lock-box">
    <div class="lock-emoji">🔒</div>
    <div class="lock-title">Hobby Diary</div>
    <input type="password" id="lock-input" placeholder="请输入密码" autocomplete="off">
    <button class="btn-primary" data-action="lock-unlock">解锁</button>
  </div>
</div>

<div id="update-banner" class="update-banner hidden" data-action="apply-update">
  <span>✨ 发现新版本，点击重启应用</span>
  <button class="update-close" data-action="dismiss-update" title="稍后再说">✕</button>
</div>

<div id="lightbox" class="lightbox hidden">
  <button class="icon-btn lightbox-close" data-action="close-lightbox" title="关闭">✕</button>
  <img id="lightbox-img" src="" alt="照片预览">
</div>

<script src="audio.js"></script>
<script src="photoStore.js"></script>
<script src="app.js?v=2.6"></script>
</body>
</html>
